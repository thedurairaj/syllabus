<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Java — Complete Syllabus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap"
            rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #FAFAF8;
            --sidebar-bg: #FFFFFF;
            --accent: #E07A3A;
            --accent-light: #FEF3EA;
            --accent-mid: #F5C99E;
            --text-primary: #1A1A18;
            --text-secondary: #5C5C58;
            --text-tertiary: #9C9C96;
            --border: #EAEAE6;
            --border-dark: #D4D4CE;
            --chip-bg: #F2F2EE;
            --white: #FFFFFF;
            --blue: #2A6DD9;
            --blue-dot: #3B82F6;
            --sidebar-w: 280px;
            --header-h: 56px;
        }

        html {
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.6
        }

        /* TOPBAR */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-h);
            background: var(--white);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
            gap: 16px
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #FF8C42, #E07A3A);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px
        }

        .brand-name {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 16px;
            color: var(--text-primary)
        }

        .brand-sub {
            font-size: 11px;
            color: var(--text-tertiary);
            display: block;
            line-height: 1.2
        }

        .topbar-stats {
            display: flex;
            gap: 8px;
            margin-left: auto
        }

        .stat-pill {
            border: 1px solid var(--border-dark);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap
        }

        .stat-pill strong {
            color: var(--text-primary)
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            top: var(--header-h);
            left: 0;
            bottom: 0;
            width: var(--sidebar-w);
            background: var(--white);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 20px 0
        }

        .sidebar::-webkit-scrollbar {
            width: 4px
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border-dark);
            border-radius: 4px
        }

        .sidebar-section-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .08em;
            color: var(--text-tertiary);
            text-transform: uppercase;
            padding: 0 18px;
            margin-bottom: 6px
        }

        .sidebar-module-btn {
            width: 100%;
            background: none;
            border: none;
            cursor: pointer;
            padding: 7px 18px;
            text-align: left;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background .15s, color .15s;
            border-radius: 0
        }

        .sidebar-module-btn:hover {
            background: #F6F6F2;
            color: var(--text-primary)
        }

        .sidebar-module-btn.active {
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 600
        }

        .sidebar-module-btn .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--blue-dot);
            flex-shrink: 0
        }

        .sidebar-module-btn.active .dot {
            background: var(--accent)
        }

        .sidebar-sep {
            height: 1px;
            background: var(--border);
            margin: 12px 18px
        }

        .sidebar-topic-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .07em;
            color: var(--text-tertiary);
            text-transform: uppercase;
            padding: 10px 18px 4px
        }

        .sidebar-topic-link {
            width: 100%;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 18px 5px 30px;
            text-align: left;
            font-size: 12.5px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color .15s
        }

        .sidebar-topic-link:hover {
            color: var(--text-primary)
        }

        .sidebar-topic-link .sdot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--blue-dot);
            flex-shrink: 0
        }

        /* MAIN */
        .main {
            margin-left: var(--sidebar-w);
            padding-top: var(--header-h);
            min-height: 100vh
        }

        .main-inner {
            padding: 28px 32px;
            max-width: 960px
        }

        /* MODULE HERO */
        .module-hero {
            background: var(--accent-light);
            border: 1px solid var(--accent-mid);
            border-radius: 14px;
            padding: 28px 30px;
            margin-bottom: 24px
        }

        .hero-module-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .hero-module-label svg {
            width: 14px;
            height: 14px
        }

        .hero-title {
            font-family: 'Fraunces', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            margin-bottom: 10px
        }

        .hero-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 18px;
            line-height: 1.6;
            max-width: 72ch
        }

        .hero-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px
        }

        .hero-chip {
            background: var(--white);
            border: 1px solid var(--border-dark);
            border-radius: 20px;
            padding: 4px 13px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary)
        }

        /* SEARCH + CONTROLS */
        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px
        }

        .search-wrap {
            position: relative;
            flex: 1
        }

        .search-wrap svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            width: 15px;
            height: 15px
        }

        .search-input {
            width: 100%;
            border: 1px solid var(--border-dark);
            border-radius: 9px;
            padding: 9px 12px 9px 36px;
            font-size: 13.5px;
            font-family: inherit;
            background: var(--white);
            color: var(--text-primary);
            outline: none;
            transition: border .15s
        }

        .search-input:focus {
            border-color: var(--accent)
        }

        .search-input::placeholder {
            color: var(--text-tertiary)
        }

        .ctrl-btn {
            border: 1px solid var(--border-dark);
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            background: var(--white);
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s, border-color .15s, color .15s
        }

        .ctrl-btn:hover {
            background: var(--chip-bg)
        }

        /* MODULE SECTION */
        .module-section {
            margin-bottom: 10px
        }

        .module-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid var(--border)
        }

        .mod-sec-left {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .mod-badge {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .03em;
            color: var(--accent);
            background: var(--accent-light);
            border: 1px solid var(--accent-mid);
            border-radius: 6px;
            padding: 3px 9px;
            font-family: 'DM Sans', sans-serif
        }

        .mod-sec-title {
            font-family: 'Fraunces', serif;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary)
        }

        .mod-sec-count {
            font-size: 12px;
            color: var(--text-tertiary)
        }

        /* TOPIC GROUPS */
        .topic-card {
            border: 1px solid var(--border);
            border-radius: 11px;
            margin-bottom: 8px;
            overflow: hidden;
            transition: box-shadow .15s
        }

        .topic-card:hover {
            box-shadow: 0 2px 12px rgba(0, 0, 0, .06)
        }

        .topic-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            cursor: pointer;
            background: var(--white);
            transition: background .15s;
            user-select: none
        }

        .topic-header:hover {
            background: #FAFAF8
        }

        .topic-num {
            background: var(--accent-light);
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            border-radius: 7px;
            padding: 4px 9px;
            min-width: 38px;
            text-align: center;
            flex-shrink: 0;
            font-family: 'DM Sans', sans-serif
        }

        .topic-info {
            flex: 1
        }

        .topic-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px
        }

        .topic-tags {
            font-size: 12px;
            color: var(--text-tertiary)
        }

        .topic-chevron {
            color: var(--text-tertiary);
            flex-shrink: 0;
            transition: transform .22s
        }

        .topic-chevron.open {
            transform: rotate(180deg)
        }

        .subtopics-wrap {
            display: none;
            border-top: 1px solid var(--border);
            background: #FDFDFB
        }

        .subtopics-wrap.open {
            display: block
        }

        .subtopics-grid {
            display: grid;
            grid-template-columns:1fr 1fr;
            gap: 0;
            padding: 0
        }

        @media (max-width: 640px) {
            .subtopics-grid {
                grid-template-columns:1fr
            }
        }

        .subtopic-item {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 10px 18px;
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.45;
            transition: background .1s
        }

        .subtopic-item:hover {
            background: #F6F6F2;
            color: var(--text-primary)
        }

        .subtopic-item:nth-child(even) {
            border-right: none
        }

        .subtopic-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent-mid);
            flex-shrink: 0;
            margin-top: 6px
        }

        .module-nav {
            display: flex;
            gap: 6px;
            margin-bottom: 28px;
            flex-wrap: wrap
        }

        .mod-nav-btn {
            border: 1px solid var(--border-dark);
            border-radius: 7px;
            padding: 6px 14px;
            font-size: 12.5px;
            font-weight: 500;
            background: var(--white);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all .15s
        }

        .mod-nav-btn:hover {
            background: var(--chip-bg)
        }

        .mod-nav-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--white)
        }

        .hidden {
            display: none !important
        }

        /* Responsive and Mobile-friendly Styles */
        .mobile-toggle {
            display: none;
        }

        .mobile-stats {
            display: none;
        }

        .sidebar-overlay {
            display: none;
        }

        @media (max-width: 768px) {
            .mobile-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                background: none;
                border: none;
                color: var(--text-primary);
                cursor: pointer;
                padding: 8px;
                margin-left: -8px;
                border-radius: 6px;
                transition: background 0.15s;
            }

            .mobile-toggle:hover {
                background: var(--chip-bg);
            }

            .topbar-brand {
                gap: 8px;
            }

            .topbar-stats {
                display: none !important;
            }

            .mobile-stats {
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding: 0 18px 16px;
                border-bottom: 1px solid var(--border);
                margin-bottom: 16px;
            }

            .mobile-stats .stat-pill {
                border: 1px solid var(--border-dark);
                border-radius: 20px;
                padding: 6px 12px;
                font-size: 12px;
                font-weight: 500;
                color: var(--text-secondary);
                text-align: center;
                background: var(--bg);
            }

            .mobile-stats .stat-pill strong {
                color: var(--text-primary);
            }

            .sidebar {
                position: fixed;
                top: var(--header-h);
                left: calc(-1 * var(--sidebar-w));
                bottom: 0;
                width: var(--sidebar-w);
                z-index: 1000;
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .sidebar.open {
                transform: translateX(var(--sidebar-w));
                box-shadow: 4px 0 24px rgba(0, 0, 0, 0.12);
            }

            .sidebar-overlay {
                display: block;
                position: fixed;
                top: var(--header-h);
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(2px);
                z-index: 999;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
            }

            .sidebar-overlay.open {
                opacity: 1;
                pointer-events: auto;
            }

            .main {
                margin-left: 0;
            }

            .main-inner {
                padding: 20px 16px;
            }

            .topbar {
                padding: 0 16px;
            }
        }

        @media (max-width: 640px) {
            .subtopics-grid {
                grid-template-columns: 1fr;
            }

            .subtopic-item {
                border-right: none !important;
            }
        }

        @media (max-width: 576px) {
            .controls-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .ctrl-btn {
                text-align: center;
                padding: 10px;
            }

            .module-hero {
                padding: 20px 16px;
                border-radius: 10px;
            }

            .hero-title {
                font-size: 22px;
            }

            .hero-desc {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
    <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle Menu">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>
    <div class="topbar-brand">
        <div class="brand-icon">☕</div>
        <div>
            <span class="brand-name">Core Java</span>
            <span class="brand-sub">Complete Syllabus</span>
        </div>
    </div>
    <div class="topbar-stats">
        <div class="stat-pill"><strong>15</strong> Modules</div>
        <div class="stat-pill"><strong>72+</strong> Topic Groups</div>
        <div class="stat-pill"><strong>290+</strong> Leaf Items</div>
        <div class="stat-pill" id="active-module-pill">Module 1 of 15</div>
    </div>
</header>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
    <div class="mobile-stats">
        <div class="stat-pill"><strong>15</strong> Modules</div>
        <div class="stat-pill"><strong>72+</strong> Topic Groups</div>
        <div class="stat-pill"><strong>290+</strong> Leaf Items</div>
        <div class="stat-pill" id="mobile-active-module-pill">Module 1 of 15</div>
    </div>
    <div class="sidebar-section-label">Modules</div>
    <button class="sidebar-module-btn active" onclick="showModule(0,this)"><span class="dot"></span>1. Platform &
        Environment
    </button>
    <button class="sidebar-module-btn" onclick="showModule(1,this)"><span class="dot"></span>2. Java Fundamentals
    </button>
    <button class="sidebar-module-btn" onclick="showModule(2,this)"><span class="dot"></span>3. Arrays & Strings
    </button>
    <button class="sidebar-module-btn" onclick="showModule(3,this)"><span class="dot"></span>4. OOP — Foundations
    </button>
    <button class="sidebar-module-btn" onclick="showModule(4,this)"><span class="dot"></span>5. OOP — Advanced</button>
    <button class="sidebar-module-btn" onclick="showModule(5,this)"><span class="dot"></span>6. Exception Handling
    </button>
    <button class="sidebar-module-btn" onclick="showModule(6,this)"><span class="dot"></span>7. Wrapper, Enum &
        Annotations
    </button>
    <button class="sidebar-module-btn" onclick="showModule(7,this)"><span class="dot"></span>8. Generics</button>
    <button class="sidebar-module-btn" onclick="showModule(8,this)"><span class="dot"></span>9. Collections Framework
    </button>
    <button class="sidebar-module-btn" onclick="showModule(9,this)"><span class="dot"></span>10. Functional & Streams
    </button>
    <button class="sidebar-module-btn" onclick="showModule(10,this)"><span class="dot"></span>11. Date/Time, I/O &
        Serialization
    </button>
    <button class="sidebar-module-btn" onclick="showModule(11,this)"><span class="dot"></span>12. Multithreading &
        Concurrency
    </button>
    <button class="sidebar-module-btn" onclick="showModule(12,this)"><span class="dot"></span>13. Reflection & Modern
        Features
    </button>
    <button class="sidebar-module-btn" onclick="showModule(13,this)"><span class="dot"></span>14. JVM Internals &
        Performance
    </button>
    <button class="sidebar-module-btn" onclick="showModule(14,this)"><span class="dot"></span>15. Design, Security &
        Testing
    </button>

    <div class="sidebar-sep"></div>
    <div class="sidebar-topic-label" id="sidebar-topics-label">Topic Groups</div>
    <div id="sidebar-topics"></div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- MAIN -->
<main class="main">
    <div class="main-inner" id="main-inner"></div>
</main>

<script>
    const modules = [
        {
            num: 1, title: "Java Platform & Environment Setup",
            level: "Beginner",
            chips: ["JDK/JVM/JRE", "Java Versions", "IDE Setup", "javac & java", "JAR & Build Tools"],
            desc: "Everything needed to understand the Java platform, install and configure the JDK, set up a development environment, and write your first compiled Java program.",
            topics: [
                {
                    name: "Java Platform Overview",
                    tags: "JDK · JRE · JVM · Distributions · LTS",
                    subs: ["Java SE vs Java EE vs Jakarta EE vs Java ME", "JDK vs JRE vs JVM distinction", "Java release cadence and LTS versions (8, 11, 17, 21)", "OpenJDK and vendor distributions (Oracle, Adoptium, Azul, Amazon Corretto)"]
                },
                {
                    name: "Development Environment",
                    tags: "Installation · PATH · JAVA_HOME · IDE",
                    subs: ["JDK installation and JAVA_HOME configuration", "PATH and classpath environment variables", "IDE setup: IntelliJ IDEA, Eclipse, VS Code", "Compiling with javac and running with java", "JAR file creation and execution", "Maven and Gradle project structure basics"]
                },
                {
                    name: "Java Program Structure",
                    tags: "Class · main · Package · Import · Bytecode",
                    subs: ["Source file naming conventions", "Package declaration", "Import statements", "Class declaration anatomy", "main method signature", "Compilation and bytecode (.class files)", "javap bytecode disassembler basics"]
                }
            ]
        },
        {
            num: 2, title: "Java Fundamentals",
            level: "Beginner",
            chips: ["Data Types", "Operators", "Control Flow", "Switch Expressions"],
            desc: "Master primitive types, type conversions, all operator categories, and every control flow construct including modern switch expressions introduced in Java 14+.",
            topics: [
                {
                    name: "Data Types & Variables",
                    tags: "Primitives · var · Literals · Defaults",
                    subs: ["Primitive types: byte, short, int, long, float, double, char, boolean", "Primitive size, range, and default values", "Reference types overview", "Variable declaration and initialization", "Local, instance, and static variables", "var keyword (local variable type inference, Java 10+)", "Literal formats: decimal, octal, hex, binary, underscore separators"]
                },
                {
                    name: "Type Conversions",
                    tags: "Widening · Narrowing · Casting · Overflow",
                    subs: ["Widening and narrowing conversions", "Implicit vs explicit casting", "Casting between numeric types", "String to primitive conversions", "Overflow and underflow behavior"]
                },
                {
                    name: "Operators",
                    tags: "Arithmetic · Bitwise · Ternary · instanceof",
                    subs: ["Arithmetic operators (+, -, *, /, %)", "Relational operators", "Logical operators (&& || !)", "Bitwise and shift operators (& | ^ ~ << >> >>>)", "Compound assignment operators", "Ternary operator", "instanceof operator", "Operator precedence and associativity"]
                },
                {
                    name: "Control Flow",
                    tags: "if · switch · for · while · break · continue",
                    subs: ["if / else if / else", "switch statement (traditional)", "Switch expression (Java 14+, arrow syntax)", "Switch with yield (Java 14+)", "Pattern matching in switch (Java 21)", "for loop", "while loop", "do-while loop", "break and continue", "Labeled break and continue", "Enhanced for-each loop"]
                }
            ]
        },
        {
            num: 3, title: "Arrays & Strings",
            level: "Beginner",
            chips: ["Arrays", "String", "StringBuilder", "Text Blocks"],
            desc: "Deep dive into arrays, the String class and its immutability, StringBuilder for mutation, and Text Blocks for multi-line string literals introduced in Java 15.",
            topics: [
                {
                    name: "Arrays",
                    tags: "1D · 2D · Jagged · Arrays utility · Varargs",
                    subs: ["Single-dimensional array declaration and initialization", "Multi-dimensional and jagged arrays", "Array traversal with loops and for-each", "Arrays class utility methods (sort, binarySearch, copyOf, fill)", "Array to List conversion", "System.arraycopy", "Varargs (variable-length arguments)"]
                },
                {

                    subs: ["JUnit 5 architecture (Platform, Jupiter, Vintage)", "@Test, @BeforeEach, @AfterEach, @BeforeAll, @AfterAll", "Assertions: assertEquals, assertThrows, assertAll", "@ParameterizedTest and argument sources", "@DisplayName and @Tag", "@Disabled", "Test lifecycle and extension model", "Mockito: @Mock, @InjectMocks, when/thenReturn, verify", "AssertJ fluent assertions", "Code coverage with JaCoCo", "Test-Driven Development (TDD) cycle"]
                },
                {
                    name: "Build Tools & Ecosystem",
                    tags: "Maven · Gradle · Multi-module · CI",
                    subs: ["Maven: pom.xml structure, lifecycle phases, plugins, repositories, dependency scopes", "Gradle: build.gradle, tasks, plugins, Kotlin DSL basics", "Dependency management and version conflicts", "Multi-module projects", "Running tests in CI pipeline basics"]
                }
            ]
        }
    ];

    let activeModule = 0;

    function buildSidebarTopics(mod) {
        const container = document.getElementById("sidebar-topics");
        container.innerHTML = "";
        mod.topics.forEach((t, i) => {
            const btn = document.createElement("button");
            btn.className = "sidebar-topic-link";
            btn.innerHTML = `<span class="sdot"></span>${mod.num}.${i + 1} ${t.name}`;
            btn.onclick = () => {
                const el = document.getElementById("topic-" + i);
                if (el) el.scrollIntoView({behavior: "smooth", block: "start"});
                
                // Close sidebar on mobile
                const sidebar = document.getElementById("sidebar");
                const overlay = document.getElementById("sidebar-overlay");
                if (sidebar && sidebar.classList.contains("open")) {
                    sidebar.classList.remove("open");
                    overlay.classList.remove("open");
                }
            };
            container.appendChild(btn);
        });
    }

    function renderModule(idx) {
        activeModule = idx;
        const mod = modules[idx];
        
        const activePill = document.getElementById("active-module-pill");
        if (activePill) activePill.textContent = `Module ${idx + 1} of ${modules.length}`;
        const mobileActivePill = document.getElementById("mobile-active-module-pill");
        if (mobileActivePill) mobileActivePill.textContent = `Module ${idx + 1} of ${modules.length}`;
        buildSidebarTopics(mod);

        const main = document.getElementById("main-inner");
        main.innerHTML = "";

        // Hero
        const hero = document.createElement("div");
        hero.className = "module-hero";
        hero.innerHTML = `
    <div class="hero-module-label">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2L2 5v4c0 3 2.5 5.5 6 7 3.5-1.5 6-4 6-7V5L8 2z"/></svg>
      MODULE ${mod.num} — CORE JAVA
    </div>
    <div class="hero-title">${mod.title}</div>
    <div class="hero-desc">${mod.desc}</div>
    <div class="hero-chips">${mod.chips.map(c => `<span class="hero-chip">${c}</span>`).join("")}</div>
  `;
        main.appendChild(hero);

        // Search + controls
        const cr = document.createElement("div");
        cr.className = "controls-row";
        cr.innerHTML = `
    <div class="search-wrap">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="6"/><path d="M15 15l3 3"/></svg>
      <input class="search-input" type="text" placeholder="Search topics, subtopics..." id="search-input" />
    </div>
    <button class="ctrl-btn" onclick="expandAll()">Expand All</button>
    <button class="ctrl-btn" onclick="collapseAll()">Collapse All</button>
  `;
        main.appendChild(cr);

        // Section header
        const sh = document.createElement("div");
        sh.className = "module-section";
        sh.innerHTML = `<div class="module-section-header">
    <div class="mod-sec-left">
      <span class="mod-badge">MODULE ${mod.num}</span>
      <span class="mod-sec-title">${mod.title}</span>
    </div>
    <span class="mod-sec-count">${mod.topics.length} topic groups</span>
  </div>`;
        main.appendChild(sh);

        // Topics
        mod.topics.forEach((t, i) => {
            const card = document.createElement("div");
            card.className = "topic-card";
            card.id = "topic-" + i;

            const subsHtml = t.subs.map(s => `<div class="subtopic-item"><span class="subtopic-dot"></span>${s}</div>`).join("");

            card.innerHTML = `
      <div class="topic-header" onclick="toggleTopic(this)">
        <span class="topic-num">${mod.num}.${i + 1}</span>
        <div class="topic-info">
          <div class="topic-name">${t.name}</div>
          <div class="topic-tags">${t.tags}</div>
        </div>
        <svg class="topic-chevron" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 8 10 13 15 8"/></svg>
      </div>
      <div class="subtopics-wrap">
        <div class="subtopics-grid">${subsHtml}</div>
      </div>`;
            sh.appendChild(card);
        });

        // Search
        document.getElementById("search-input").addEventListener("input", function () {
            const q = this.value.toLowerCase();
            document.querySelectorAll(".topic-card").forEach(card => {
                const name = card.querySelector(".topic-name").textContent.toLowerCase();
                const subs = Array.from(card.querySelectorAll(".subtopic-item")).map(s => s.textContent.toLowerCase()).join(" ");
                const match = !q || name.includes(q) || subs.includes(q);
                card.classList.toggle("hidden", !match);
                if (q && match) {
                    card.querySelector(".subtopics-wrap").classList.add("open");
                    card.querySelector(".topic-chevron").classList.add("open");
                }
            });
        });
    }

    function toggleTopic(header) {
        const wrap = header.nextElementSibling;
        const chev = header.querySelector(".topic-chevron");
        wrap.classList.toggle("open");
        chev.classList.toggle("open");
    }

    function expandAll() {
        document.querySelectorAll(".subtopics-wrap").forEach(w => w.classList.add("open"));
        document.querySelectorAll(".topic-chevron").forEach(c => c.classList.add("open"));
    }

    function collapseAll() {
        document.querySelectorAll(".subtopics-wrap").forEach(w => w.classList.remove("open"));
        document.querySelectorAll(".topic-chevron").forEach(c => c.classList.remove("open"));
    }

    function showModule(idx, btn) {
        document.querySelectorAll(".sidebar-module-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderModule(idx);
        window.scrollTo({top: 0, behavior: "smooth"});

        // Close sidebar on mobile
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("sidebar-overlay");
        if (sidebar && sidebar.classList.contains("open")) {
            sidebar.classList.remove("open");
            overlay.classList.remove("open");
        }
    }

    // Mobile menu toggle logic
    const toggleBtn = document.getElementById("mobile-toggle");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebar-overlay");

    if (toggleBtn && sidebar && overlay) {
        toggleBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("open");
        });

        overlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("open");
        });
    }

    // Init
    renderModule(0);
</script>
</body>
</html>
