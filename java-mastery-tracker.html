<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Java Mastery Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #0a0c0f;
            --surface: #111318;
            --surface2: #181c23;
            --border: #1e242f;
            --accent: #f97316;
            --accent2: #fb923c;
            --green: #22c55e;
            --red: #ef4444;
            --muted: #4b5563;
            --text: #e2e8f0;
            --textdim: #94a3b8;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Syne', sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── NOISE OVERLAY ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* ── HEADER ── */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 12, 15, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: var(--sans);
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .logo-badge {
            background: var(--accent);
            color: #000;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 3px;
            letter-spacing: 0.08em;
            font-family: var(--mono);
        }

        .header-meta {
            font-size: 0.72rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            display: inline-block;
            box-shadow: 0 0 8px var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        /* ── LAYOUT ── */
        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 2rem 4rem;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            position: sticky;
            top: 80px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* ── STAT CARD ── */
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.4rem 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), transparent);
        }

        .stat-label {
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .stat-value {
            font-family: var(--sans);
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text);
            line-height: 1;
        }

        .stat-value span {
            color: var(--accent);
        }

        .stat-sub {
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 0.4rem;
        }

        /* ── PROGRESS CARD ── */
        .progress-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.4rem 1.5rem;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .progress-title {
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .progress-pct {
            font-family: var(--sans);
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent);
        }

        .progress-track {
            height: 6px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 0.8rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 99px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.4);
        }

        .phase-bars {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.8rem;
        }

        .phase-row {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .phase-meta {
            display: flex;
            justify-content: space-between;
        }

        .phase-name {
            font-size: 0.65rem;
            color: var(--textdim);
        }

        .phase-stat {
            font-size: 0.65rem;
            color: var(--muted);
        }

        .phase-track {
            height: 3px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
        }

        .phase-fill {
            height: 100%;
            border-radius: 99px;
            transition: width 0.5s ease;
        }

        .p1 {
            background: #6366f1;
        }

        .p2 {
            background: #0ea5e9;
        }

        .p3 {
            background: #22c55e;
        }

        .p4 {
            background: #f97316;
        }

        /* ── TODAY'S TASK CARD ── */
        .today-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .today-header {
            background: var(--accent);
            color: #000;
            padding: 0.6rem 1.2rem;
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .today-body {
            padding: 1.2rem;
        }

        .today-day {
            font-family: var(--sans);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.3rem;
            letter-spacing: 0.05em;
        }

        .today-topic {
            font-family: var(--sans);
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .today-tags {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 3px;
            letter-spacing: 0.06em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .tag-theory {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .tag-code {
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.25);
        }

        .tag-problem {
            background: rgba(249, 115, 22, 0.12);
            color: #fb923c;
            border: 1px solid rgba(249, 115, 22, 0.25);
        }

        .mark-done-btn {
            margin-top: 1rem;
            width: 100%;
            padding: 0.65rem;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: var(--mono);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mark-done-btn:hover {
            background: var(--accent);
            color: #000;
        }

        .mark-done-btn.done {
            background: var(--green);
            border-color: var(--green);
            color: #000;
        }

        /* ── RESET BTN ── */
        .reset-btn {
            width: 100%;
            padding: 0.5rem;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            border-color: var(--red);
            color: var(--red);
        }

        /* ── MAIN PANEL ── */
        .main-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* ── FILTER BAR ── */
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 0.35rem 0.9rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(249, 115, 22, 0.08);
        }

        .search-box {
            margin-left: auto;
            padding: 0.35rem 0.9rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.72rem;
            outline: none;
            transition: border-color 0.2s;
            width: 200px;
        }

        .search-box::placeholder {
            color: var(--muted);
        }

        .search-box:focus {
            border-color: var(--accent);
        }

        /* ── PHASE SECTION ── */
        .phase-section {
        }

        .phase-label {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }

        .phase-tag {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 3px;
        }

        .ph1 {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
        }

        .ph2 {
            background: rgba(14, 165, 233, 0.15);
            color: #38bdf8;
        }

        .ph3 {
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
        }

        .ph4 {
            background: rgba(249, 115, 22, 0.12);
            color: #fb923c;
        }

        .phase-divider {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .phase-count {
            font-size: 0.65rem;
            color: var(--muted);
        }

        /* ── DAY GRID ── */
        .day-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.6rem;
        }

        /* ── DAY CARD ── */
        .day-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.9rem 1rem;
            cursor: pointer;
            transition: all 0.18s;
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .day-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.04), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .day-card:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .day-card:hover::after {
            opacity: 1;
        }

        .day-card.completed {
            border-color: rgba(34, 197, 94, 0.4);
            background: rgba(34, 197, 94, 0.04);
        }

        .day-card.completed::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--green);
        }

        .day-card.today-highlight {
            border-color: var(--accent);
            background: rgba(249, 115, 22, 0.05);
        }

        .day-card.today-highlight::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent);
        }

        .day-card.hidden {
            display: none;
        }

        .dc-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .dc-num {
            font-family: var(--sans);
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--muted);
            letter-spacing: 0.05em;
        }

        .day-card.completed .dc-num {
            color: var(--green);
        }

        .day-card.today-highlight .dc-num {
            color: var(--accent);
        }

        .dc-check {
            width: 18px;
            height: 18px;
            border: 1.5px solid var(--border);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .day-card.completed .dc-check {
            background: var(--green);
            border-color: var(--green);
        }

        .dc-check svg {
            display: none;
        }

        .day-card.completed .dc-check svg {
            display: block;
        }

        .dc-topic {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--textdim);
            line-height: 1.4;
            margin-bottom: 0.5rem;
        }

        .day-card.completed .dc-topic {
            color: var(--text);
        }

        .dc-pills {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }

        .dc-pill {
            font-size: 0.55rem;
            padding: 1px 6px;
            border-radius: 2px;
            letter-spacing: 0.05em;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* ── COMPLETION RING ── */
        .ring-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem 0;
        }

        .ring-svg {
            transform: rotate(-90deg);
        }

        .ring-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 8;
        }

        .ring-fg {
            fill: none;
            stroke: var(--accent);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 251.2;
            transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.5));
        }

        .ring-text {
            font-family: var(--sans);
            font-size: 1.1rem;
            font-weight: 800;
            fill: var(--text);
            dominant-baseline: middle;
            text-anchor: middle;
        }

        .ring-sub {
            font-size: 0.55rem;
            fill: var(--muted);
            dominant-baseline: middle;
            text-anchor: middle;
            font-family: var(--mono);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* ── STREAK CARD ── */
        .streak-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.2rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .streak-icon {
            font-size: 1.8rem;
            line-height: 1;
        }

        .streak-info {
            flex: 1;
        }

        .streak-label {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
        }

        .streak-val {
            font-family: var(--sans);
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
        }

        .streak-sub {
            font-size: 0.65rem;
            color: var(--muted);
            margin-top: 0.1rem;
        }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            width: 90%;
            max-width: 560px;
            max-height: 80vh;
            overflow-y: auto;
            transform: translateY(16px);
            transition: transform 0.25s;
        }

        .modal-overlay.open .modal {
            transform: translateY(0);
        }

        .modal-head {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--surface2);
        }

        .modal-title {
            font-family: var(--sans);
            font-size: 1rem;
            font-weight: 800;
            color: var(--text);
        }

        .modal-close {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            width: 28px;
            height: 28px;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .modal-close:hover {
            border-color: var(--red);
            color: var(--red);
        }

        .modal-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .modal-section {
        }

        .modal-section-title {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
            margin-bottom: 0.5rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-topic {
            font-family: var(--sans);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.8rem;
        }

        .checklist {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.75rem;
            color: var(--textdim);
            cursor: pointer;
            padding: 0.3rem 0;
            transition: color 0.15s;
        }

        .check-item:hover {
            color: var(--text);
        }

        .check-item input {
            display: none;
        }

        .check-box {
            width: 16px;
            height: 16px;
            border: 1.5px solid var(--border);
            border-radius: 3px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .check-item.checked .check-box {
            background: var(--green);
            border-color: var(--green);
        }

        .check-item.checked .check-box::after {
            content: '✓';
            color: #000;
            font-size: 0.65rem;
            font-weight: 900;
        }

        .check-item.checked {
            color: var(--muted);
            text-decoration: line-through;
        }

        .modal-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }

        .btn-complete {
            flex: 1;
            padding: 0.7rem;
            border-radius: 5px;
            border: none;
            background: var(--green);
            color: #000;
            font-family: var(--mono);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-complete:hover {
            opacity: 0.85;
        }

        .btn-undo {
            padding: 0.7rem 1rem;
            border-radius: 5px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-undo:hover {
            border-color: var(--red);
            color: var(--red);
        }

        /* ── MINI HEATMAP ── */
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            margin-top: 0.5rem;
        }

        .hm-cell {
            aspect-ratio: 1;
            border-radius: 2px;
            background: var(--border);
            transition: background 0.2s;
            cursor: pointer;
            position: relative;
        }

        .hm-cell.done {
            background: var(--green);
        }

        .hm-cell.today {
            background: var(--accent);
            box-shadow: 0 0 6px rgba(249, 115, 22, 0.5);
        }

        .hm-cell.future {
            opacity: 0.3;
        }

        .hm-cell:hover::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 5px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.6rem;
            padding: 3px 7px;
            border-radius: 3px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 10;
        }

        /* ── CONFETTI ── */
        .confetti-piece {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 999;
            animation: confetti-fall 1.2s ease-out forwards;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(400px) rotate(720deg);
                opacity: 0;
            }
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.8rem 1.2rem;
            font-size: 0.75rem;
            color: var(--text);
            z-index: 300;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            max-width: 280px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-accent {
            border-left: 3px solid var(--accent);
        }

        .toast-green {
            border-left: 3px solid var(--green);
        }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 99px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }

        /* ── RESPONSIVE ── */

            }

            }
        }

            return `<div class="phase-row">
      <div class="phase-meta">
        <span class="phase-name">${ph.name.split('—')[1].trim()}</span>
        <span class="phase-stat">${phDone}/${total}</span>
      </div>
      <div class="phase-track">
        <div class="phase-fill ${ph.fillCls}" style="width:${phPct}%"></div>
      </div>
    </div>`;
        }).join('');

        // Streak
        let streak = 0, best = parseInt(localStorage.getItem('java-best-streak') || '0');
        let d = new Date();
        while (true) {
            const ds = d.toISOString().slice(0, 10);
            const dayN = Math.floor((new Date(ds) - new Date(state.startDay)) / 86400000) + 1;
            if (dayN < 1 || dayN > 90) break;
            if (!state.completed[dayN]) {
                if (ds === getTodayStr()) {
                    d.setDate(d.getDate() - 1);
                    continue;
                }
                break;
            }
            streak++;
            d.setDate(d.getDate() - 1);
        }
        if (streak > best) {
            best = streak;
            localStorage.setItem('java-best-streak', best);
        }
        document.getElementById('streak-val').textContent = streak;
        document.getElementById('best-streak').textContent = best;

        // Today card
        const cur = CURRICULUM.find(c => c.day === todayDay);
        if (cur) {
            document.getElementById('today-day-label').textContent = `Day ${cur.day}`;
            document.getElementById('today-day-num').textContent = `Day ${cur.day} / 90`;
            document.getElementById('today-topic').textContent = cur.topic;
            const tagsEl = document.getElementById('today-tags');
            tagsEl.innerHTML = cur.tags.map(t => `<span class="tag tag-${t === 'theory' ? 'theory' : t === 'code' ? 'code' : 'problem'}">${t}</span>`).join('');
            const btn = document.getElementById('mark-done-btn');
            if (isCompleted(cur.day)) {
                btn.textContent = '✓ Completed';
                btn.classList.add('done');
            } else {
                btn.textContent = '✓ Mark Complete';
                btn.classList.remove('done');
            }
        }
    }

    function renderHeatmap() {
        const hm = document.getElementById('heatmap');
        const todayDay = getTodayDay();
        hm.innerHTML = CURRICULUM.map(c => {
            let cls = 'hm-cell';
            if (isCompleted(c.day)) cls += ' done';
            else if (c.day === todayDay) cls += ' today';
            else if (c.day > todayDay) cls += ' future';
            return `<div class="${cls}" data-tip="D${c.day}" onclick="openModal(${c.day})"></div>`;
        }).join('');
    }

    let currentFilter = 'all';

    function renderPhases() {
        const container = document.getElementById('phase-sections');
        container.innerHTML = '';
        PHASES.forEach(ph => {
            const [s, e] = ph.days;
            const days = CURRICULUM.filter(c => c.day >= s && c.day <= e);
            const done = days.filter(c => isCompleted(c.day)).length;

            const section = document.createElement('div');
            section.className = 'phase-section';
            section.dataset.phase = ph.id;

            section.innerHTML = `
      <div class="phase-label">
        <span class="phase-tag ${ph.cls}">${ph.name}</span>
        <div class="phase-divider"></div>
        <span class="phase-count">${done}/${days.length} done</span>
      </div>
      <div class="day-grid" id="grid-${ph.id}">
        ${days.map(c => buildDayCard(c)).join('')}
      </div>`;
            container.appendChild(section);
        });
    }

    function buildDayCard(c) {
        const todayDay = getTodayDay();
        const done = isCompleted(c.day);
        let cls = 'day-card';
        if (done) cls += ' completed';
        else if (c.day === todayDay) cls += ' today-highlight';

        const tagHtml = c.tags.slice(0, 2).map(t => {
            const col = t === 'theory' ? '#818cf8' : t === 'code' ? '#4ade80' : t === 'revision' ? '#fb923c' : t === 'project' ? '#f59e0b' : '#94a3b8';
            return `<span class="dc-pill" style="background:${col}22;color:${col};border:1px solid ${col}44">${t}</span>`;
        }).join('');

        return `<div class="${cls}" id="dc-${c.day}" data-day="${c.day}" data-phase="${c.phase}"
    data-topic="${c.topic.toLowerCase()}"
    onclick="openModal(${c.day})">
    <div class="dc-top">
      <span class="dc-num">Day ${c.day}</span>
      <div class="dc-check">
        <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
          <path d="M1 4l2.5 2.5L9 1" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <div class="dc-topic">${c.topic}</div>
    <div class="dc-pills">${tagHtml}</div>
  </div>`;
    }

    // ══════════════════════════════════════════════════════
    //  FILTER
    // ══════════════════════════════════════════════════════
    function setFilter(f, el) {
        currentFilter = f;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        if (el) el.classList.add('active');
        applyFilter();
    }

    function applyFilter() {
        const q = document.getElementById('search-box').value.toLowerCase().trim();
        const f = currentFilter;
        const todayDay = getTodayDay();

        document.querySelectorAll('.day-card').forEach(card => {
            const day = parseInt(card.dataset.day);
            const phase = card.dataset.phase;
            const topic = card.dataset.topic || '';
            const done = isCompleted(day);
            const isToday = day === todayDay;

            let show = true;
            if (f === 'done') show = done;
            if (f === 'pending') show = !done;
            if (f === 'today') show = isToday;
            if (f === 'p1') show = phase === 'p1';
            if (f === 'p2') show = phase === 'p2';
            if (f === 'p3') show = phase === 'p3';
            if (f === 'p4') show = phase === 'p4';

            if (q && !topic.includes(q)) show = false;
            card.classList.toggle('hidden', !show);
        });

        // Hide phase sections if all cards hidden
        document.querySelectorAll('.phase-section').forEach(sec => {
            const visible = [...sec.querySelectorAll('.day-card')].some(c => !c.classList.contains('hidden'));
            sec.style.display = visible ? '' : 'none';
        });
    }

    // ══════════════════════════════════════════════════════
    //  MODAL
    // ══════════════════════════════════════════════════════
    function openModal(dayNum) {
        const c = CURRICULUM.find(x => x.day === dayNum);
        if (!c) return;

        const done = isCompleted(dayNum);
        const todayDay = getTodayDay();

        document.getElementById('modal-title').textContent = `Day ${dayNum} / 90`;

        const checkKeys = c.tags.filter(t => CHECKLISTS[t]);
        const checkItems = checkKeys.flatMap(k => CHECKLISTS[k].map(item => ({item, key: `${dayNum}-${item}`})));

        const savedChecks = JSON.parse(localStorage.getItem(`java-checks-${dayNum}`) || '{}');

        const checkHtml = checkItems.map(({item, key}) => {
            const checked = savedChecks[key] ? 'checked' : '';
            return `<label class="check-item ${checked}" id="ci-${key.replace(/[^a-z0-9]/gi, '_')}" onclick="toggleCheck('${key}', this)">
      <div class="check-box"></div>
      <span>${item}</span>
    </label>`;
        }).join('');

        document.getElementById('modal-body').innerHTML = `
    <div class="modal-section">
      <div class="modal-section-title">Topic</div>
      <div class="modal-topic">${c.topic}</div>
      <div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.5rem;">
        ${c.tags.map(t => `<span class="tag tag-${t === 'theory' ? 'theory' : t === 'code' ? 'code' : 'problem'}">${t}</span>`).join('')}
      </div>
    </div>
    ${checkHtml.length ? `
    <div class="modal-section">
      <div class="modal-section-title">Daily Checklist</div>
      <div class="checklist">${checkHtml}</div>
    </div>` : ''}
    <div class="modal-section">
      <div class="modal-section-title">Notes</div>
      <textarea id="day-notes-${dayNum}"
        style="width:100%;min-height:70px;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:0.7rem;color:var(--text);font-family:var(--mono);font-size:0.72rem;resize:vertical;outline:none;"
        placeholder="Your notes for this day…"
        oninput="saveNotes(${dayNum}, this.value)">${localStorage.getItem('java-notes-' + dayNum) || ''}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-complete" onclick="toggleDayComplete(${dayNum})">${done ? '✓ Mark Incomplete' : '✓ Mark Complete'}</button>
      <button class="btn-undo" onclick="closeModal()">Close</button>
    </div>`;

        document.getElementById('modal-overlay').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('modal-overlay').classList.remove('open');
        document.body.style.overflow = '';
    }

    function closeModalOutside(e) {
        if (e.target === document.getElementById('modal-overlay')) closeModal();
    }

    function toggleCheck(key, el) {
        const dayNum = parseInt(key.split('-')[0]);
        const saved = JSON.parse(localStorage.getItem(`java-checks-${dayNum}`) || '{}');
        saved[key] = !saved[key];
        localStorage.setItem(`java-checks-${dayNum}`, JSON.stringify(saved));
        el.classList.toggle('checked', !!saved[key]);
    }

    function saveNotes(dayNum, val) {
        localStorage.setItem('java-notes-' + dayNum, val);
    }

    // ══════════════════════════════════════════════════════
    //  COMPLETE / UNDO
    // ══════════════════════════════════════════════════════
    function toggleDayComplete(dayNum) {
        if (isCompleted(dayNum)) {
            delete state.completed[dayNum];
            showToast('Day ' + dayNum + ' marked incomplete.', 'accent');
        } else {
            state.completed[dayNum] = getTodayStr();
            showToast('🎉 Day ' + dayNum + ' complete!', 'green');
            firework();
        }
        saveState();
        closeModal();
        renderPhases();
        renderSidebar();
        renderHeatmap();
        applyFilter();
    }

    function markTodayDone() {
        const todayDay = getTodayDay();
        if (isCompleted(todayDay)) {
            showToast('Already marked done!', 'accent');
            return;
        }
        state.completed[todayDay] = getTodayStr();
        saveState();
        showToast('🎉 Day ' + todayDay + ' complete! Keep going!', 'green');
        firework();
        renderPhases();
        renderSidebar();
        renderHeatmap();
        applyFilter();
    }

    function confirmReset() {
        if (confirm('⚠ Reset ALL progress? This cannot be undone.')) {
            state = {completed: {}, startDay: getTodayStr()};
            localStorage.removeItem('java-best-streak');
            saveState();
            renderPhases();
            renderSidebar();
            renderHeatmap();
            applyFilter();
            showToast('Progress reset. Day 1 starts now!', 'accent');
        }
    }

    // ══════════════════════════════════════════════════════
    //  ANIMATIONS
    // ══════════════════════════════════════════════════════
    function firework() {
        const colors = ['#f97316', '#22c55e', '#6366f1', '#f59e0b', '#38bdf8', '#fb923c'];
        for (let i = 0; i < 20; i++) {
            const el = document.createElement('div');
            el.className = 'confetti-piece';
            el.style.cssText = `left:${20 + Math.random() * 60}%;top:${10 + Math.random() * 30}%;background:${colors[i % colors.length]};animation-delay:${Math.random() * 0.4}s;transform:rotate(${Math.random() * 360}deg)`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1800);
        }
    }

    function showToast(msg, type = 'accent') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = `toast toast-${type} show`;
        setTimeout(() => {
            t.classList.remove('show');
        }, 2800);
    }

    // ══════════════════════════════════════════════════════
    //  KEYBOARD
    // ══════════════════════════════════════════════════════
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeModal();
    });

    // ══════════════════════════════════════════════════════
    //  INIT
    // ══════════════════════════════════════════════════════
    loadState();
    render();

    // Re-render clock every minute
    setInterval(() => {
        renderSidebar();
    }, 60000);
</script>
</body>
</html>
