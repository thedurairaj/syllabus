<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Java · Spring Boot · Microservices — Learning Path</title>
    <meta name="description" content="A structured learning path from Java fundamentals to production-ready microservices, mapped from the freeCodeCamp System Design course."/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        /* ── Reset ── */
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth}

        /* ── Tokens ── */
        :root{
            --bg:           #ffffff;
            --bg-2:         #f6f8fa;
            --bg-3:         #eef1f4;
            --bg-hover:     #f0f3f6;
            --border:       #d0d7de;
            --border-2:     #b0bbc5;
            --text:         #1f2328;
            --text-2:       #656d76;
            --text-3:       #9198a1;
            --java:         #b36200;
            --java-bg:      rgba(240,165,0,.10);
            --java-bd:      rgba(180,120,0,.22);
            --spring:       #3a7a1a;
            --spring-bg:    rgba(109,179,63,.10);
            --spring-bd:    rgba(80,150,40,.22);
            --micro:        #0969da;
            --micro-bg:     rgba(9,105,218,.09);
            --micro-bd:     rgba(9,105,218,.22);
            --db:           #c0372e;
            --db-bg:        rgba(192,55,46,.09);
            --db-bd:        rgba(192,55,46,.22);
            --accent:       #0969da;
            --r:            8px;
            --r-lg:         12px;
            --mono:         'JetBrains Mono',monospace;
            --sans:         'Inter',system-ui,sans-serif;
            --sidebar-w:    240px;
            --mid-w:        300px;
            --header-h:     112px;
        }

        body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh;overflow-x:hidden}

        /* ══ HEADER ══ */
        .site-header{
            position:sticky;top:0;z-index:200;
            background:rgba(255,255,255,.92);
            backdrop-filter:blur(14px);
            border-bottom:1px solid var(--border);
        }
        .header-top{
            display:flex;align-items:center;justify-content:space-between;
            padding:.75rem 1.5rem;
            border-bottom:1px solid var(--border);
        }
        .brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--text)}
        .brand-icon{font-size:20px;line-height:1}
        .brand em{font-style:normal;color:var(--accent)}
        .header-stats{
            display:flex;align-items:center;gap:0;
        }
        .hstat{
            display:flex;flex-direction:column;align-items:center;
            padding:0 1.25rem;border-right:1px solid var(--border);
        }
        .hstat:last-child{border-right:none}
        .hstat-num{font-size:18px;font-weight:700;color:var(--text);line-height:1.1}
        .hstat-lbl{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
        .phase-indicator{
            padding:.5rem 1.5rem;
            font-size:11px;color:var(--text-2);
            background:var(--bg-2);
            display:flex;align-items:center;justify-content:space-between;
        }
        .phase-crumb{font-weight:500;color:var(--text)}
        .phase-dur{color:var(--text-3)}

        /* ══ LAYOUT ══ */
        .layout{
            display:grid;
            grid-template-columns:var(--sidebar-w) var(--mid-w) 1fr;
            min-height:calc(100vh - var(--header-h));
            position:relative;
        }

        /* ══ LEFT — Phase list ══ */
        .sidebar{
            border-right:1px solid var(--border);
            position:sticky;
            top:var(--header-h);
            height:calc(100vh - var(--header-h));
            overflow-y:auto;
            scrollbar-width:thin;
            scrollbar-color:var(--border) transparent;
            background:var(--bg);
        }
        .sidebar-label{
            padding:.75rem 1rem .4rem;
            font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
            color:var(--text-3);
        }
        .phase-item{
            display:flex;align-items:center;gap:10px;
            padding:.6rem 1rem;
            cursor:pointer;
            border-left:2px solid transparent;
            transition:background .12s,border-color .12s,color .12s;
            position:relative;
        }
        .phase-item:hover{background:var(--bg-hover);color:var(--text)}
        .phase-item.active{
            background:var(--bg-2);
            border-left-color:var(--accent);
            color:var(--text);
        }
        .phase-num{
            width:22px;height:22px;border-radius:50%;
            display:flex;align-items:center;justify-content:center;
            font-size:10px;font-weight:600;flex-shrink:0;
            background:var(--bg-3);color:var(--text-2);
            transition:background .12s,color .12s;
        }
        .phase-item.active .phase-num{background:var(--accent);color:#fff}
        .phase-name{font-size:12px;color:var(--text-2);line-height:1.3;flex:1}
        .phase-item.active .phase-name{color:var(--text)}
        .phase-icon-sm{font-size:14px;flex-shrink:0}

        /* ══ MID — Topic groups ══ */
        .mid-panel{
            border-right:1px solid var(--border);
            position:sticky;
            top:var(--header-h);
            height:calc(100vh - var(--header-h));
            overflow-y:auto;
            scrollbar-width:thin;
            scrollbar-color:var(--border) transparent;
            background:var(--bg);
        }
        .mid-label{
            padding:.75rem 1rem .4rem;
            font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
            color:var(--text-3);
        }
        .topic-item{
            display:flex;align-items:center;gap:10px;
            padding:.6rem 1rem;
            cursor:pointer;
            border-left:2px solid transparent;
            transition:background .12s,border-color .12s;
        }
        .topic-item:hover{background:var(--bg-hover)}
        .topic-item.active{background:var(--bg-2);border-left-color:var(--accent)}
        .topic-tag{
            font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
            padding:2px 6px;border-radius:20px;flex-shrink:0;
            border:1px solid transparent;
        }
        .tag-java  {color:var(--java);  background:var(--java-bg);  border-color:var(--java-bd)}
        .tag-spring{color:var(--spring);background:var(--spring-bg);border-color:var(--spring-bd)}
        .tag-micro {color:var(--micro); background:var(--micro-bg); border-color:var(--micro-bd)}
        .tag-db    {color:var(--db);    background:var(--db-bg);    border-color:var(--db-bd)}
        .topic-name{font-size:12px;color:var(--text-2);flex:1;line-height:1.35}
        .topic-item.active .topic-name{color:var(--text)}
        .topic-count{
            font-size:10px;color:var(--text-3);
            background:var(--bg-3);
            padding:1px 6px;border-radius:10px;flex-shrink:0;
            font-family:var(--mono);
            border:1px solid var(--border);
        }

        /* ══ RIGHT — Detail panel ══ */
        .detail-panel{
            overflow-y:auto;
            scrollbar-width:thin;
            scrollbar-color:var(--border) transparent;
            padding:1.5rem;
            background:var(--bg);
        }
        .detail-empty{
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            height:60vh;color:var(--text-3);text-align:center;gap:.5rem;
        }
        .detail-empty-icon{font-size:2.5rem;opacity:.4}
        .detail-empty-text{font-size:13px}

        .detail-card{
            background:var(--bg-2);
            border:1px solid var(--border);
            border-radius:var(--r-lg);
            padding:1.5rem;
            margin-bottom:1.25rem;
        }
        .detail-header{
            display:flex;align-items:flex-start;gap:.75rem;
            margin-bottom:1.25rem;
        }
        .detail-icon{font-size:1.75rem;line-height:1;flex-shrink:0;margin-top:2px}
        .detail-title{font-size:17px;font-weight:600;color:var(--text);line-height:1.25;margin-bottom:.3rem}
        .detail-desc{font-size:13px;color:var(--text-2);line-height:1.55}
        .detail-meta{
            display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.65rem;
        }
        .meta-chip{
            display:inline-flex;align-items:center;gap:4px;
            font-size:10px;font-weight:500;
            padding:2px 8px;border-radius:20px;
            background:var(--bg-3);border:1px solid var(--border-2);color:var(--text-2);
        }

        .section-title{
            font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
            color:var(--text-3);margin-bottom:.65rem;
            display:flex;align-items:center;gap:6px;
        }
        .section-title::after{content:'';flex:1;height:1px;background:var(--border)}

        /* Technologies */
        .tech-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.25rem}
        .tech-chip{
            font-family:var(--mono);font-size:11px;
            color:var(--text-2);
            background:var(--bg-2);
            border:1px solid var(--border);
            border-radius:var(--r);
            padding:3px 9px;
            transition:border-color .12s,color .12s;
        }
        .tech-chip:hover{border-color:var(--border-2);color:var(--text)}

        /* Practice project */
        .practice-card{
            background:rgba(58,122,26,.05);
            border:1px solid var(--spring-bd);
            border-left:3px solid var(--spring);
            border-radius:0 var(--r) var(--r) 0;
            padding:.85rem 1rem;
            margin-bottom:1.25rem;
        }
        .practice-label{
            font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
            color:var(--spring);margin-bottom:4px;
        }
        .practice-text{font-size:13px;color:var(--text-2);line-height:1.55}

        /* Leaf items */
        .leaf-list{
            display:flex;flex-direction:column;gap:4px;margin-bottom:1.25rem;
        }
        .leaf-item{
            display:flex;align-items:flex-start;gap:8px;
            padding:.45rem .65rem;
            background:var(--bg-2);
            border:1px solid var(--border);
            border-radius:var(--r);
            font-size:12px;color:var(--text-2);
            transition:border-color .12s,color .12s;
        }
        .leaf-item:hover{border-color:var(--border-2);color:var(--text)}
        .leaf-bullet{
            width:5px;height:5px;border-radius:50%;
            background:var(--text-3);flex-shrink:0;margin-top:5px;
        }
        .leaf-bullet.java-dot  {background:var(--java)}
        .leaf-bullet.spring-dot{background:var(--spring)}
        .leaf-bullet.micro-dot {background:var(--micro)}
        .leaf-bullet.db-dot    {background:var(--db)}

        /* Copy btn */
        .copy-btn{
            display:inline-flex;align-items:center;gap:5px;
            font-size:11px;font-weight:500;
            color:var(--text-2);
            background:none;border:1px solid var(--border);border-radius:var(--r);
            padding:4px 10px;cursor:pointer;
            transition:color .12s,border-color .12s,background .12s;
        }
        .copy-btn:hover{color:var(--text);border-color:var(--border-2);background:var(--bg-hover)}
        .copy-btn.copied{color:var(--spring);border-color:var(--spring-bd)}

        /* Phase header in right panel */
        .phase-banner{
            background:var(--bg-2);
            border:1px solid var(--border);
            border-radius:var(--r-lg);
            padding:1.25rem 1.5rem;
            margin-bottom:1.25rem;
            display:flex;align-items:flex-start;gap:1rem;
        }
        .phase-banner-icon{font-size:2rem;line-height:1;flex-shrink:0}
        .phase-banner-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:.25rem}
        .phase-banner-desc{font-size:12px;color:var(--text-2);line-height:1.55}
        .phase-dur-pill{
            margin-top:.5rem;display:inline-flex;align-items:center;gap:5px;
            font-size:11px;color:var(--text-2);
            background:var(--bg-3);border:1px solid var(--border);border-radius:20px;padding:2px 10px;
        }

        /* ══ MOBILE ══ */
        @media(max-width:900px){
            :root{--sidebar-w:200px;--mid-w:220px}
        }
        @media(max-width:640px){
            .layout{grid-template-columns:1fr}
            .sidebar,.mid-panel{
                position:static;height:auto;
                border-right:none;border-bottom:1px solid var(--border);
            }
            .detail-panel{padding:1rem}
            .header-stats{display:none}
        }
    </style>
</head>
<body>

<!-- ══ SITE HEADER ══ -->
<header class="site-header">
    <div class="header-top">
        <div class="brand">
            <span class="brand-icon">☕</span>
            Java · Spring Boot · Microservices <em>— Learning Path</em>
        </div>
        <div class="header-stats">
            <div class="hstat"><span class="hstat-num">6</span><span class="hstat-lbl">Phases</span></div>
            <div class="hstat"><span class="hstat-num">24</span><span class="hstat-lbl">Topics</span></div>
            <div class="hstat"><span class="hstat-num">90+</span><span class="hstat-lbl">Leaf Items</span></div>
            <div class="hstat"><span class="hstat-num">15–21w</span><span class="hstat-lbl">Duration</span></div>
        </div>
    </div>
    <div class="phase-indicator">
        <span id="crumbPhase" class="phase-crumb">Phase 1 — Single server setup &amp; Java foundations</span>
        <span id="crumbDur" class="phase-dur">2–3 weeks · select a topic →</span>
    </div>
</header>

<!-- ══ 3-COLUMN LAYOUT ══ -->
<div class="layout">

    <!-- LEFT: Phase list -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-label">Phases</div>
        <!-- Populated by JS -->
    </aside>

    <!-- MID: Topic groups -->
    <div class="mid-panel" id="midPanel">
        <div class="mid-label">Topic Groups</div>
        <!-- Populated by JS -->
    </div>

    <!-- RIGHT: Detail -->
    <div class="detail-panel" id="detailPanel">
        <div class="detail-empty" id="emptyState">
            <div class="detail-empty-icon">📖</div>
            <div class="detail-empty-text">Select a topic group to see details</div>
        </div>
    </div>

</div>

    /* ══════════════════════════════════════════════
       STATE

    let activePhase = 0;
    let activeTopic = 0;

    /* ══════════════════════════════════════════════
       RENDER
    ══════════════════════════════════════════════ */
    function renderSidebar() {
        const sb = document.getElementById('sidebar');
        sb.innerHTML = '<div class="sidebar-label">Phases</div>' +
            DATA.map((p, i) => `
      <div class="phase-item${i===activePhase?' active':''}" onclick="selectPhase(${i})" title="${p.title}">
        <div class="phase-num">${i+1}</div>
        <div class="phase-name">${p.icon} ${p.title}</div>
      </div>
    `).join('');
    }

    function renderMid() {
        const ph = DATA[activePhase];
        const mid = document.getElementById('midPanel');
        mid.innerHTML = '<div class="mid-label">Topic Groups</div>' +
            ph.topics.map((t, i) => `
      <div class="topic-item${i===activeTopic?' active':''}" onclick="selectTopic(${i})">
        <span class="topic-tag tag-${t.tag}">${t.tag}</span>
        <span class="topic-name">${t.title}</span>
        <span class="topic-count">${t.leaves.length}</span>
      </div>
    `).join('');
    }

    function renderDetail() {
        const ph  = DATA[activePhase];
        const top = ph.topics[activeTopic];
        const dotClass = {java:'java-dot',spring:'spring-dot',micro:'micro-dot',db:'db-dot'}[top.tag]||'micro-dot';

        document.getElementById('emptyState') && (document.getElementById('emptyState').style.display='none');

        document.getElementById('detailPanel').innerHTML = `
    <div class="phase-banner">
      <div class="phase-banner-icon">${ph.icon}</div>
      <div>
        <div class="phase-banner-title">${ph.title}</div>
        <div class="phase-banner-desc">${ph.desc}</div>
        <div class="phase-dur-pill">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          ${ph.duration}
        </div>
      </div>
    </div>

    <div class="detail-card">
      <div class="detail-header">
        <div style="display:flex;flex-direction:column;gap:.4rem;flex:1">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="topic-tag tag-${top.tag}">${top.tag}</span>
            <span class="detail-title">${top.title}</span>
          </div>
          <div class="detail-desc">${top.desc}</div>
          <div class="detail-meta">
            <span class="meta-chip">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
              ${top.leaves.length} leaf items
            </span>
            <span class="meta-chip">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><polyline points="9 9 15 9 15 15 9 15 9 9"/></svg>
              ${top.techs.length} technologies
            </span>
          </div>
        </div>
      </div>

      <div class="section-title">Technologies</div>
      <div class="tech-grid">
        ${top.techs.map(t=>`<span class="tech-chip">${t}</span>`).join('')}
      </div>

      <div class="section-title">Practice project</div>
      <div class="practice-card">
        <div class="practice-label">🛠 Hands-on project</div>
        <div class="practice-text" id="practiceText">${top.practice}</div>
      </div>
      <button class="copy-btn" id="copyBtn" onclick="copyPractice()">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy project brief
      </button>
    </div>

    <div class="section-title" style="padding:0 0 .4rem">Leaf Items — ${top.leaves.length} topics</div>
    <div class="leaf-list">
      ${top.leaves.map(l=>`
        <div class="leaf-item">
          <span class="leaf-bullet ${dotClass}"></span>
          <span>${l}</span>
        </div>
      `).join('')}
    </div>
  `;
    }

    function renderCrumb() {
        const ph = DATA[activePhase];
        document.getElementById('crumbPhase').textContent = `Phase ${activePhase+1} — ${ph.title}`;
        document.getElementById('crumbDur').textContent = `${ph.duration} · topic ${activeTopic+1} of ${ph.topics.length}`;
    }

    function selectPhase(i) {
        activePhase = i;
        activeTopic = 0;
        renderSidebar();
        renderMid();
        renderDetail();
        renderCrumb();
    }

    function selectTopic(i) {
        activeTopic = i;
        renderMid();
        renderDetail();
        renderCrumb();
    }

    function copyPractice() {
        const ph  = DATA[activePhase];
        const top = ph.topics[activeTopic];
        navigator.clipboard.writeText(top.practice).then(()=>{
            const btn = document.getElementById('copyBtn');
            btn.classList.add('copied');
            btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
            setTimeout(()=>{
                btn.classList.remove('copied');
                btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy project brief`;
            }, 2000);
        });
    }

    /* Init */
    renderSidebar();
    renderMid();
    renderDetail();
    renderCrumb();
</script>
